appId: com.electron.app
productName: zenith
directories:
  buildResources: build
files:
  - out/**/*
  - package.json
  - resources/icon.png
  - resources/licenses/**
  - resources/gamepad-bridge.ps1
  - resources/gamepad-bridge.py
  - '!**/*.{dll,DLL,so,SO,bin,BIN,iso,ISO,chd,nds,gba,mp3,mp4,pdf,log,part}'
  # Runtime/firmware never ship, even when placed accidentally below an allowed folder.
  - '!**/{rpcs3,RPCS3,dev_flash,dev_flash2,dev_flash3,dev_hdd0,dev_hdd1,PS3_GAME}/**'
  - '!**/*.{[pP][uU][pP],[pP][kK][gG],[rR][aA][pP],[rR][iI][fF],[sS][eE][lL][fF],[sS][pP][rR][xX]}'
  - '!**/rpcs3*.{exe,EXE,AppImage}'
  # Full 7-Zip extraction engine is a licensed utility, not an emulator core.
  - node_modules/7zip-bin-full/**
asarUnpack:
  - resources/**
  - node_modules/7zip-bin/**
  - node_modules/7zip-bin-full/**
beforePack: scripts/validate-emulators.cjs
extraResources:
  - from: emulators/retroarch
    to: emulators/retroarch
    filter:
      - '**/*'
      - '!**/*.log'
      - '!**/.gitkeep'
      - '!cores/**'
      - '!**/{rpcs3,RPCS3,portable,dev_flash,dev_flash2,dev_flash3,dev_hdd0,dev_hdd1,PS3_GAME}/**'
      - '!**/*.{[pP][uU][pP],[pP][kK][gG],[rR][aA][pP],[rR][iI][fF],[sS][eE][lL][fF],[sS][pP][rR][xX]}'
      - '!**/rpcs3*.{exe,EXE,AppImage}'
      # A development installation can contain private BIOS and user data.
      - '!{system,saves,states,screenshots,thumbnails,records,recordings,config,cheats,downloads,playlists,logs,cache,media,games,roms}{,/**/*}'
      - '!**/*.{iso,ISO,bin,BIN,chd,CHD,rom,ROM,log,LOG,part,tmp,srm,state,lpl}'
      - '!retroarch.cfg'
      - '!retroarch-core-options.cfg'
      - '!session.cfg'
win:
  icon: build/icon.ico
  target: nsis
  executableName: zenith
  forceCodeSigning: false
  # Resource editing embeds Zenith's icon in zenith.exe; no certificate is required.
  signAndEditExecutable: true
portable:
  artifactName: ${name}-${version}-${arch}-portable.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  differentialPackage: true
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: electronjs.org
  category: Game
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: aibrhmckr
  repo: zenith-os
  releaseType: release
